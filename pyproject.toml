[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aziza"
version = "2.0.0"
description = "Assistant Intelligent pour l'Évaluation de la Contraction de Texte"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AZIZA Team"}
]
dependencies = [
    "flask>=3.0,<4.0",
    "scikit-learn>=1.3",
    "numpy>=2.0",
    "requests>=2.31",
    "language-tool-python>=2.7.1",
    "python-dotenv>=1.0",
    "flasgger>=0.9.7",
    "flask-limiter>=3.8",
    "gunicorn>=21.2",
]

[project.urls]
Homepage = "https://github.com/anomalyco/aziza"

[tool.setuptools.packages.find]
include = ["aziza*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests.py"]
python_files = ["tests.py"]
